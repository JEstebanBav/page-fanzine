<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Experiencia interactiva de storytelling visual" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Fanzine</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ========== Loading Screen ========== -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Preparando experiencia</p>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <span class="pct">0%</span>
  </div>

  <!-- ========== Main App ========== -->
  <div id="app">

    <!-- Jungle Background -->
    <div id="jungle-bg"></div>

    <!-- Book -->
    <div id="book-section">
      <div id="book-wrapper"></div>
      <div id="page-dots"></div>
    </div>

    <!-- Navigation -->
    <div id="navigation"></div>

    <!-- Keyboard hint (desktop only) -->
    <div id="kbd-hint">
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> <span>para navegar</span>
    </div>

    <!-- ========== Calendar Animation Overlay ========== -->
    <div id="calendar-overlay">
      <div class="backdrop"></div>
      <canvas id="particle-canvas"></canvas>

      <div id="anim-container">
        <!-- Page thumbs and puzzle grid injected by JS -->

        <!-- Final image reveal -->
        <div id="final-image-wrap">
          <img src="public/pages/calendar-final.png" alt="Calendario Final" draggable="false" />
        </div>
      </div>

      <!-- Back button -->
      <button id="back-btn">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver
      </button>

      <!-- Completion title -->
      <div id="complete-title">
        <h2>Calendario Final</h2>
        <p>Hoja desplegada</p>
      </div>
    </div>

  </div>

  <!-- ========== Libraries (CDN) ========== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <!-- App -->
  <script src="app.js"></script>

</body>
</html>
